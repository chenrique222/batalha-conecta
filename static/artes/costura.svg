<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf0d6"/><stop offset="1" stop-color="#f1dfb8"/>
    </linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c48a52"/><stop offset="1" stop-color="#9a6436"/>
    </linearGradient>
    <linearGradient id="maquina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e7ee"/>
    </linearGradient>
    <linearGradient id="tecido" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9573a"/><stop offset="1" stop-color="#a8402a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d98a8"/><stop offset=".5" stop-color="#e8ecf1"/><stop offset="1" stop-color="#8d98a8"/>
    </linearGradient>
    <pattern id="flores" width="70" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <circle cx="18" cy="18" r="7" fill="#f6c76a"/><circle cx="18" cy="18" r="3" fill="#fff4dc"/>
      <circle cx="53" cy="52" r="6" fill="#fbe4dc"/><circle cx="53" cy="52" r="2.5" fill="#f0b23e"/>
      <circle cx="50" cy="15" r="2.5" fill="#fbe4dc" opacity=".8"/>
    </pattern>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5a3a1c" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Parede, luz da janela e mesa de madeira -->
  <rect width="1536" height="1024" fill="url(#parede)"/>
  <ellipse cx="1300" cy="200" rx="420" ry="260" fill="#fff8e8" opacity=".45"/>
  <rect y="690" width="1536" height="334" fill="url(#mesa)"/>
  <rect y="690" width="1536" height="16" fill="#d9a46d"/>
  <path d="M0 770 C300 760 500 790 800 778 S1300 760 1536 780" stroke="#8a5a30" stroke-width="3" fill="none" opacity=".35"/>
  <path d="M0 880 C350 870 600 900 950 885 S1350 870 1536 892" stroke="#8a5a30" stroke-width="3" fill="none" opacity=".3"/>

  <!-- Tecido estampado passando pela máquina e caindo da mesa -->
  <g filter="url(#sombra)">
    <path d="M150 700 C260 660 420 668 620 676 L1000 690 C1060 700 1080 760 1040 820 C980 900 760 920 560 1024 L120 1024 C90 920 80 780 150 700 Z" fill="url(#tecido)"/>
    <path d="M150 700 C260 660 420 668 620 676 L1000 690 C1060 700 1080 760 1040 820 C980 900 760 920 560 1024 L120 1024 C90 920 80 780 150 700 Z" fill="url(#flores)"/>
    <path d="M250 760 C420 740 640 760 900 760" stroke="#fff4dc" stroke-width="4" stroke-dasharray="16 12" fill="none" opacity=".9"/>
    <path d="M190 860 C380 830 600 840 860 820" stroke="#8f3420" stroke-width="10" fill="none" opacity=".25"/>
  </g>

  <!-- Máquina de costura -->
  <g filter="url(#sombra)">
    <rect x="360" y="618" width="700" height="70" rx="20" fill="#d8dde6"/>
    <rect x="360" y="618" width="700" height="34" rx="17" fill="url(#maquina)"/>
    <rect x="860" y="330" width="170" height="320" rx="38" fill="url(#maquina)"/>
    <rect x="390" y="270" width="640" height="140" rx="62" fill="url(#maquina)"/>
    <rect x="390" y="300" width="130" height="300" rx="40" fill="url(#maquina)"/>
    <!-- faixas azul-marinho e verde -->
    <rect x="430" y="330" width="560" height="22" rx="11" fill="#1b3f78"/>
    <rect x="430" y="358" width="560" height="8" rx="4" fill="#2fbf71"/>
    <rect x="884" y="420" width="122" height="150" rx="26" fill="#1b3f78" opacity=".12"/>
    <!-- botão de ponto -->
    <circle cx="945" cy="470" r="38" fill="#f0b23e" stroke="#b9821a" stroke-width="6"/>
    <circle cx="945" cy="470" r="20" fill="#f6c76a"/>
    <rect x="940" y="434" width="10" height="26" rx="5" fill="#7a4f05"/>
    <g fill="#1b3f78"><circle cx="903" cy="430" r="5"/><circle cx="945" cy="418" r="5"/><circle cx="987" cy="430" r="5"/></g>
    <!-- volante lateral -->
    <circle cx="1048" cy="380" r="74" fill="#c9d0db"/>
    <circle cx="1048" cy="380" r="58" fill="#eef1f5"/>
    <circle cx="1048" cy="380" r="16" fill="#8d98a8"/>
    <rect x="1040" y="324" width="16" height="112" rx="8" fill="#b4bcc8"/>
    <!-- agulha, calcador e chapa -->
    <rect x="436" y="590" width="26" height="40" rx="6" fill="#8d98a8"/>
    <rect x="445" y="626" width="7" height="44" fill="url(#metal)"/>
    <path d="M420 668 L486 668 L478 682 L428 682 Z" fill="#8d98a8"/>
    <rect x="540" y="640" width="120" height="14" rx="7" fill="#c4cad5"/>
    <!-- carretel em cima da máquina e linha até a agulha -->
    <rect x="690" y="238" width="10" height="40" fill="#8d98a8"/>
    <rect x="662" y="196" width="66" height="14" rx="5" fill="#e2b07a"/>
    <rect x="668" y="208" width="54" height="40" fill="#0f7a55"/>
    <path d="M668 216 H722 M668 226 H722 M668 236 H722" stroke="#0b6646" stroke-width="3"/>
    <rect x="662" y="246" width="66" height="12" rx="5" fill="#e2b07a"/>
    <path d="M668 222 C600 215 520 250 470 300 C455 320 452 400 452 600" stroke="#0f7a55" stroke-width="4" fill="none"/>
  </g>

  <!-- Carretéis de linha -->
  <g filter="url(#sombra)">
    <g transform="translate(1150 560)">
      <rect x="0" y="0" width="96" height="20" rx="8" fill="#e2b07a"/>
      <rect x="10" y="18" width="76" height="94" fill="#c9573a"/>
      <path d="M10 34 H86 M10 52 H86 M10 70 H86 M10 88 H86" stroke="#a8402a" stroke-width="4"/>
      <rect x="0" y="110" width="96" height="20" rx="8" fill="#e2b07a"/>
    </g>
    <g transform="translate(1268 540)">
      <rect x="0" y="0" width="104" height="22" rx="8" fill="#e2b07a"/>
      <rect x="11" y="20" width="82" height="110" fill="#f0b23e"/>
      <path d="M11 38 H93 M11 58 H93 M11 78 H93 M11 98 H93 M11 116 H93" stroke="#c98f1e" stroke-width="4"/>
      <rect x="0" y="128" width="104" height="22" rx="8" fill="#e2b07a"/>
    </g>
    <g transform="translate(1394 572)">
      <rect x="0" y="0" width="90" height="18" rx="7" fill="#e2b07a"/>
      <rect x="9" y="16" width="72" height="86" fill="#1b3f78"/>
      <path d="M9 32 H81 M9 50 H81 M9 68 H81 M9 86 H81" stroke="#132f5c" stroke-width="4"/>
      <rect x="0" y="100" width="90" height="18" rx="7" fill="#e2b07a"/>
    </g>
  </g>

  <!-- Fita métrica -->
  <g filter="url(#sombra)">
    <path d="M1080 930 C1150 860 1260 840 1330 880 C1400 920 1380 990 1300 990 C1230 990 1220 930 1280 915" stroke="#f0b23e" stroke-width="38" fill="none" stroke-linecap="round"/>
    <path d="M1080 930 C1150 860 1260 840 1330 880 C1400 920 1380 990 1300 990 C1230 990 1220 930 1280 915" stroke="#7a4f05" stroke-width="16" stroke-dasharray="3 17" fill="none" opacity=".75"/>
  </g>

  <!-- Tesoura -->
  <g transform="translate(1030 760) rotate(-18)" filter="url(#sombra)">
    <path d="M40 40 L330 18 L332 34 Z" fill="url(#metal)" stroke="#6f7a8a" stroke-width="2"/>
    <path d="M40 44 L330 74 L326 88 Z" fill="url(#metal)" stroke="#6f7a8a" stroke-width="2"/>
    <circle cx="96" cy="48" r="9" fill="#6f7a8a"/>
    <ellipse cx="-12" cy="10" rx="48" ry="30" fill="none" stroke="#0f7a55" stroke-width="16"/>
    <ellipse cx="-4" cy="86" rx="44" ry="28" fill="none" stroke="#0f7a55" stroke-width="16"/>
  </g>

  <!-- Almofada de alfinetes -->
  <g filter="url(#sombra)">
    <ellipse cx="200" cy="640" rx="92" ry="70" fill="#b4452c"/>
    <path d="M118 630 C150 600 250 600 282 630" stroke="#8f3420" stroke-width="6" fill="none"/>
    <path d="M200 572 L200 708" stroke="#8f3420" stroke-width="6" opacity=".5"/>
    <path d="M200 572 C180 548 196 532 214 540 C226 530 246 546 226 566 Z" fill="#2fbf71"/>
    <g stroke="#b4bcc6" stroke-width="5" stroke-linecap="round">
      <path d="M160 600 L132 548"/><path d="M230 596 L262 548"/><path d="M190 600 L182 540"/>
    </g>
    <circle cx="132" cy="548" r="11" fill="#f0b23e"/><circle cx="262" cy="548" r="11" fill="#1b3f78"/><circle cx="182" cy="540" r="11" fill="#2fbf71"/>
  </g>
</svg>
